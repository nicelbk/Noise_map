# 공공시설 배치 기준 (도시공원 및 녹지 등에 관한 법률, 학교시설기준)
parks:
  neighborhood:
    name: "근린공원"
    area_min_m2: 10000
    area_max_m2: 100000
    service_radius_m: 500
    households_per_park: 1000
