    color: "#808080"
    far_default: 0
    far_seoul: 0
    bcr: 0
    description: "도로"

# 용도 배치 원칙 (우선순위)
placement_rules:
  상업:
    prefer: ["대로변", "교통결절점", "기존도로변"]
    avoid: ["주거지 내부", "녹지 인접"]
  준주거:
    prefer: ["대로변", "상업 인접"]
    avoid: ["최외곽"]
  제3종일반주거:
    prefer: ["보조간선도로변"]
    avoid: ["최외곽"]
  제2종일반주거:
    prefer: ["내부", "조용한 위치"]
    avoid: []
  제1종일반주거:
    prefer: ["외곽", "녹지 인접"]
    avoid: ["대로변"]
  공원:
    prefer: ["주거 인접", "북측"]
    avoid: ["상업지 내부"]
  공공시설:
    prefer: ["중심부", "접근성 좋은 위치"]
    avoid: []

